name: Build HeatApp
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore HeatExchangeApp/HeatExchangeApp.csproj
      - run: dotnet build HeatExchangeApp/HeatExchangeApp.csproj --configuration Release --no-restore
